<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="vig" cx="38%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#35c8ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#vig)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g stroke="#35c8ff" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M28 28h46 M28 28v46"/>
    <path d="M1172 28h-46 M1172 28v46"/>
    <path d="M28 432h46 M28 432v-46"/>
    <path d="M1172 432h-46 M1172 432v-46"/>
  </g>

  <!-- live-status eyebrow -->
  <g transform="translate(70,120)">
    <circle cx="0" cy="-6" r="6" fill="#64ffb4"/>
    <text x="18" y="0" fill="#64ffb4" font-size="16" letter-spacing="4" font-weight="700">SYSTEM ONLINE · HANDS DETECTED</text>
  </g>

  <!-- wordmark -->
  <text x="66" y="248" fill="#35c8ff" font-size="128" font-weight="900" letter-spacing="10" filter="url(#glow)">ORIGIN</text>
  <text x="72" y="300" fill="#dcefff" font-size="26" letter-spacing="6" font-weight="600">GRAB 3D OUT OF THE AIR — WITH YOUR HANDS</text>
  <text x="72" y="344" fill="#8fb0cc" font-size="18" letter-spacing="1">MediaPipe as a sensor · every gesture is hand-written geometry · no LLM</text>

  <!-- tesseract glyph (echoes the 4D feature) -->
  <g transform="translate(1000,230)" stroke="#35c8ff" fill="none" filter="url(#glow)">
    <rect x="-95" y="-95" width="190" height="190" stroke-width="2.5" stroke-opacity="0.9"/>
    <rect x="-48" y="-48" width="96" height="96" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M-95 -95L-48 -48 M95 -95L48 -48 M95 95L48 48 M-95 95L-48 48" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="0" cy="0" r="4" fill="#35c8ff" stroke="none"/>
  </g>
</svg>
